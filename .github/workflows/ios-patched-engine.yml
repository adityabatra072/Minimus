name: ios-patched-engine

# Builds an IPA against a PATCHED llama.cpp engine instead of the published
# binary, so iOS gets the same context window Android gets from
# tools/engine/build-android-engine.ps1.
#
# Why a whole job for two lines of C++: the engine ships as a prebuilt
# xcframework inside @runanywhere/llamacpp, and Apple's toolchain only exists
# on macOS. This is the macOS box we already rent to build the app at all.
#
# Manual only — it is far slower than ios-build.yml, which stays the default
# for JS and app changes.
on:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: SDK commit to build (must match the installed npm package version)
        required: true
        default: 538db195076e5a7305a517005dbd32309a4ee43e
      frameworks_run_id:
        description: >-
          Reuse the frameworks built by an earlier run of this workflow instead
          of rebuilding them (the engine build is ~80 minutes and only changes
          when the patch does). Leave empty to build from source.
        required: false
        default: ''

concurrency:
  group: ios-patched-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Check out the SDK at the pinned commit
        if: inputs.frameworks_run_id == ''
        uses: actions/checkout@v4
        with:
          repository: RunanywhereAI/runanywhere-sdks
          ref: ${{ inputs.sdk_ref }}
          path: sdk

      - name: Apply the context-length patch
        if: inputs.frameworks_run_id == ''
        working-directory: sdk
        run: |
          git apply --verbose ../app/patches/engine/llamacpp-honour-context-length.patch
          git diff --stat

      # The engine only changes when the patch does, so an IPA rebuild for a
      # JS change should not pay 80 minutes of C++.
      - name: Reuse frameworks from an earlier run
        if: inputs.frameworks_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: runanywhere-patched-xcframeworks
          path: sdk/sdk/runanywhere-swift/Binaries
          run-id: ${{ inputs.frameworks_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        working-directory: app
        run: npm ci

      - name: Build workspace packages
        working-directory: app
        run: npm run build -w @minimus/agent-core

      # Every backend has to build: the Swift package requires the Sherpa and
      # NeuRT binaries unconditionally, so turning them off fails immediately
      # ("RAC_BACKEND_SHERPA and RAC_BACKEND_NEURT must be ON"). Only the
      # llamacpp slice is actually installed below; the rest are built and
      # thrown away. Steps mirror the SDK's own ios/swift-spm CI jobs.
      - name: Install build tools
        if: inputs.frameworks_run_id == ''
        run: brew install protobuf ninja

      - name: Download vendored ONNX Runtime and Sherpa (iOS + macOS)
        if: inputs.frameworks_run_id == ''
        working-directory: sdk
        run: |
          bash sdk/runanywhere-commons/scripts/ios/download-onnx.sh
          bash sdk/runanywhere-commons/scripts/ios/download-sherpa-onnx.sh
          bash sdk/runanywhere-commons/scripts/macos/download-sherpa-onnx.sh

      - name: Build the patched llamacpp xcframework
        if: inputs.frameworks_run_id == ''
        working-directory: sdk
        env:
          # NeuRT (Apple ANE) lives in a private sibling repo. Without it the
          # engine builds as a non-routable shell, which is fine here: this
          # job ships only the llamacpp framework, and the published NeuRT
          # binary in node_modules is left untouched.
          RAC_ALLOW_NEURT_STUB: '1'
        run: ./sdk/runanywhere-swift/scripts/build-core-xcframework.sh

      # On iOS the SDK forces RAC_STATIC_PLUGINS (commons/CMakeLists.txt:1757),
      # so engine plugins are linked INTO rac_commons rather than loaded from
      # the backend framework. The patched llamacpp therefore lives in
      # RACommons.xcframework — swapping only RABackendLLAMACPP leaves the
      # unpatched engine in place and adds a second copy of its symbols, which
      # is how the first attempt died at Ld.
      #
      # Every framework this build produced is installed over its published
      # counterpart, so the whole set stays internally consistent.
      - name: Swap the built frameworks into node_modules
        run: |
          set -euo pipefail
          echo "=== built ==="
          ls sdk/sdk/runanywhere-swift/Binaries/
          swapped=0
          for built in sdk/sdk/runanywhere-swift/Binaries/*.xcframework; do
            name="$(basename "$built")"
            # NeuRT builds as a 0-byte stub here (its implementation lives in a
            # private sibling repo), so installing ours would replace a working
            # Apple-ANE binary with nothing. Nothing about it is patched, so
            # keep the published one.
            if [ "$name" = "RABackendNeuRT.xcframework" ]; then
              echo "skipping $name (stub in this build; published binary kept)"
              continue
            fi
            for dest in app/node_modules/@runanywhere/*/ios/Binaries/"$name"; do
              [ -d "$dest" ] || continue
              rm -rf "$dest"
              # -L dereferences: the built xcframework holds each archive as a
              # SYMLINK into the staging tree, and copying the link produced a
              # framework whose slices carried only Headers. CocoaPods then
              # rsynced 20MB of headers, logged success, and the app died at Ld
              # with "Build input file cannot be found: librac_commons.a".
              cp -RL "$built" "$dest"
              echo "installed $name -> $dest"
              swapped=$((swapped + 1))
            done
          done
          test "$swapped" -gt 0 || { echo "nothing was swapped"; exit 1; }
          echo "swapped $swapped framework(s)"
          # The first attempt with this swap failed at "Build input file cannot
          # be found: XCFrameworkIntermediates/RunAnywhereCore/librac_commons.a"
          # even though CocoaPods logged copying the ios-arm64 slice, so the
          # slice layout is what to look at.
          # Every installed slice must carry a REAL archive, not a link and not
          # just headers. This is the check that would have caught the symlink
          # copy immediately instead of at the link step an hour later.
          echo "=== installed archives ==="
          missing=0
          for lib in app/node_modules/@runanywhere/*/ios/Binaries/*.xcframework/*/*.a; do
            [ -e "$lib" ] || continue
            if [ -L "$lib" ]; then
              echo "SYMLINK (will not survive): $lib"
              missing=$((missing + 1))
              continue
            fi
            size=$(stat -f%z "$lib")
            echo "$((size / 1024 / 1024))MB  $lib"
            [ "$size" -gt 1048576 ] || { echo "  ^ suspiciously small"; missing=$((missing + 1)); }
          done
          test "$missing" -eq 0 || { echo "$missing archive(s) missing or unusable"; exit 1; }

      - name: Upload the built frameworks
        if: inputs.frameworks_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: runanywhere-patched-xcframeworks
          path: sdk/sdk/runanywhere-swift/Binaries/
          retention-days: 7
          if-no-files-found: error

      - name: Pod install
        working-directory: app/apps/mobile/ios
        run: pod install --repo-update

      # Raw log kept: xcbeautify swallows linker diagnostics, and a failed Ld
      # step reported only "The following build commands failed" with no
      # symbol names, which is unfixable from a distance.
      - name: Build (Release, unsigned)
        working-directory: app/apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace mobile.xcworkspace \
            -scheme mobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build > xcodebuild.log 2>&1 || {
              echo "=== last 200 lines ==="
              tail -200 xcodebuild.log
              echo "=== errors ==="
              grep -nE "error:|Undefined symbol|symbol\(s\) not found|duplicate symbol|ld: " xcodebuild.log | head -60
              exit 1
            }
          tail -5 xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: app/apps/mobile/ios/xcodebuild.log
          if-no-files-found: ignore

      - name: Package unsigned IPA
        working-directory: app/apps/mobile/ios
        run: |
          set -euo pipefail
          appdir="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$appdir" || { echo "no .app produced"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$appdir" Payload/
          zip -qry minimus-ios-unsigned.ipa Payload
          ls -la minimus-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: minimus-ios-patched-engine
          path: app/apps/mobile/ios/minimus-ios-unsigned.ipa
          if-no-files-found: error
